<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code — GRADEETING</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
  <style>
    :root {
      --cream: #FFF8F2;
      --cream-deep: #FDEFE6;
      --white: #FFFFFF;
      --rose: #E85D75;
      --rose-deep: #C73E56;
      --rose-soft: #FBD5DC;
      --honey: #FFB627;
      --honey-soft: #FFE4A8;
      --text: #3D2C2F;
      --text-muted: #8B7276;
      --border: #F3E1DA;
      --shadow-md: 0 4px 16px rgba(199, 62, 86, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Nunito', system-ui, sans-serif;
      background: linear-gradient(180deg, var(--cream) 0%, var(--cream-deep) 100%);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.6;
    }

    .qr-card {
      background: var(--white);
      padding: 2.5rem 2rem;
      border-radius: 24px;
      box-shadow: var(--shadow-md);
      text-align: center;
      max-width: 460px;
      width: 100%;
      border-top: 6px solid var(--honey);
    }

    .brand {
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 1.8rem;
      color: var(--rose-deep);
      letter-spacing: 0.05em;
      margin-bottom: 0.3rem;
    }

    .tagline {
      font-family: 'Fredoka', sans-serif;
      font-weight: 500;
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }

    #qrcode {
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      padding: 1rem;
      border-radius: 16px;
      margin: 0 auto 1.5rem auto;
      width: 260px;
      height: 260px;
      border: 2px dashed var(--rose-soft);
    }

    #qrcode img,
    #qrcode canvas {
      border-radius: 8px;
    }

    .instructions {
      font-size: 0.95rem;
      color: var(--text);
      margin-bottom: 1.2rem;
    }

    .instructions strong {
      color: var(--rose-deep);
      font-weight: 700;
    }

    .url {
      display: inline-block;
      background: var(--rose-soft);
      color: var(--rose-deep);
      font-family: 'Fredoka', sans-serif;
      font-weight: 500;
      font-size: 0.85rem;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      margin-top: 0.4rem;
      word-break: break-all;
    }

    .actions {
      display: flex;
      gap: 0.6rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 1.5rem;
    }

    .btn {
      display: inline-block;
      background: linear-gradient(135deg, var(--rose) 0%, var(--rose-deep) 100%);
      color: white;
      text-decoration: none;
      border: none;
      font-family: 'Fredoka', sans-serif;
      font-weight: 500;
      font-size: 0.95rem;
      padding: 0.7rem 1.4rem;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: var(--shadow-md);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(199, 62, 86, 0.2);
    }

    .btn.secondary {
      background: var(--honey-soft);
      color: #8a5b00;
    }

    .btn.secondary:hover {
      box-shadow: 0 8px 22px rgba(255, 182, 39, 0.3);
    }

    .footer-note {
      margin-top: 1.5rem;
      font-family: 'Fredoka', sans-serif;
      font-weight: 400;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Impression */
    @media print {
      body {
        background: white;
        padding: 0;
      }

      .qr-card {
        box-shadow: none;
        border-top-color: var(--rose);
        max-width: 100%;
      }

      .actions {
        display: none;
      }
    }

    /* ---------- Pétales qui tombent ---------- */
    .petals-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .petal {
      position: absolute;
      top: -40px;
      font-size: 1.1rem;
      opacity: 0;
      animation: petal-fall linear infinite;
      will-change: transform, opacity;
    }

    @keyframes petal-fall {
      0% {
        transform: translateY(-40px) translateX(0) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.55;
      }
      50% {
        transform: translateY(50vh) translateX(20px) rotate(180deg);
        opacity: 0.55;
      }
      90% {
        opacity: 0.4;
      }
      100% {
        transform: translateY(105vh) translateX(-15px) rotate(360deg);
        opacity: 0;
      }
    }

    [data-theme="dark"] .petal {
      opacity: 0.35 !important;
    }
  </style>
</head>
<body>
  <!-- Pétales qui tombent en arrière-plan -->
  <div class="petals-container" aria-hidden="true">
    <span class="petal" style="left: 4%; animation-duration: 18s; animation-delay: 0s;">🌸</span>
    <span class="petal" style="left: 22%; animation-duration: 20s; animation-delay: 8s;">🌷</span>
    <span class="petal" style="left: 38%; animation-duration: 24s; animation-delay: 2s;">🌸</span>
    <span class="petal" style="left: 52%; animation-duration: 19s; animation-delay: 11s;">🌺</span>
    <span class="petal" style="left: 68%; animation-duration: 21s; animation-delay: 6s;">🌸</span>
    <span class="petal" style="left: 88%; animation-duration: 17s; animation-delay: 9s;">🌸</span>
    <span class="petal" style="left: 96%; animation-duration: 23s; animation-delay: 5s;">🌸</span>
  </div>
  <div class="qr-card">
    <div class="brand">GRADEETING</div>
    <div class="tagline">✨ Discover the stars of Aivancity ✨</div>

    <div id="qrcode"></div>

    <p class="instructions">
      <strong>Scan to meet your campus.</strong><br>
      Point your phone camera at the code.
    </p>

    <div class="url" id="url-display"></div>

    <div class="actions">
      <button class="btn" id="print-btn" type="button">🖨️ Print</button>
      <button class="btn secondary" id="copy-btn" type="button">🔗 Copy link</button>
    </div>

    <div class="footer-note">GRADEETING — Aivancity student project</div>
  </div>

  <script>
    // URL du site — on la construit à partir de l'URL courante pour qu'elle marche partout
    const SITE_URL = window.location.origin;

    // Génération du QR code
    new QRCode(document.getElementById("qrcode"), {
      text: SITE_URL,
      width: 240,
      height: 240,
      colorDark: "#3D2C2F",
      colorLight: "#FFFFFF",
      correctLevel: QRCode.CorrectLevel.H,
    });

    // Affichage de l'URL
    document.getElementById("url-display").textContent = SITE_URL;

    // Bouton imprimer
    document.getElementById("print-btn").addEventListener("click", () => {
      window.print();
    });

    // Bouton copier
    document.getElementById("copy-btn").addEventListener("click", async () => {
      const btn = document.getElementById("copy-btn");
      try {
        await navigator.clipboard.writeText(SITE_URL);
        const original = btn.textContent;
        btn.textContent = "✅ Copied!";
        setTimeout(() => { btn.textContent = original; }, 1800);
      } catch (e) {
        prompt("Copy this link:", SITE_URL);
      }
    });
  </script>
</body>
</html>
